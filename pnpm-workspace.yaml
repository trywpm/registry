packages:
  - web
  - registry
  - packages/*

catalog:
  '@cloudflare/workers-types': 4.20260615.1
  '@fast-check/vitest': 0.4.1
  '@types/bun': 1.3.14
  '@types/node': 25.9.3
  '@types/semver': 7.7.1
  'hono': 4.12.25
  'postgres': 3.4.9
  'typescript': 6.0.3
  'wrangler': 4.100.0
  'zod': 4.4.3
  'vite': npm:@voidzero-dev/vite-plus-core@0.2.1
  'vite-plus': 0.2.1

allowBuilds:
  '@clerk/shared': false
  'browser-tabs-lock': false
  'bufferutil': false
  'core-js': false
  'esbuild': false
  'sharp': false
  'utf-8-validate': false
  'workerd': false

'overrides':
  'vite': 'catalog:'
  'uuid@<11': '>=11.1.1'
  'ws@<8.21.0': '>=8.21.0'
  'undici@<7.28.0': '>=7.28.0'
  'esbuild@<0.28.1': '>=0.28.1'

packageConfigs:
  - match: ['*']
    saveExact: true

minimumReleaseAge: 4320
minimumReleaseAgeStrict: strict
minimumReleaseAgeExclude:
  - '@voidzero-dev/*'
  - vite-plus@0.2.1
